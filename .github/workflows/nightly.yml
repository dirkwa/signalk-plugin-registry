name: Nightly Plugin Registry Scan

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test scope'
        type: choice
        options:
          - changed_only
          - all_plugins
          - single_plugin
        default: changed_only
      plugin:
        description: 'Plugin npm name (single_plugin mode only)'
        required: false
      include_master:
        description: 'Also test against server master branch'
        type: boolean
        default: false
      max_jobs:
        description: 'Max parallel test jobs (default 50, max 256)'
        type: number
        default: 50
      plugin_version:
        description: >-
          Exact version to test (single_plugin mode only). Defaults to the
          version discovery resolved, which is dist-tags.latest. Set by the
          on-demand re-score path when the request named a pre-release.
        required: false
      rescore_issue:
        description: 'Issue number to report the result back to (on-demand re-score only)'
        required: false

# Coalesce duplicate on-demand scans of the SAME plugin: opening several
# rescore issues for one package must not fan out into parallel runs of that
# plugin's untrusted code. single_plugin dispatches for a given plugin share a
# group and queue (cancel-in-progress: false); the scheduled nightly and
# all_plugins runs keep their own lanes so a rescan never blocks or cancels them.
concurrency:
  group: nightly-${{ github.event_name }}-${{ github.event.inputs.mode || 'schedule' }}-${{ github.event.inputs.plugin || 'all' }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Plan — reads registry, no secrets needed
  # ─────────────────────────────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      runs: ${{ steps.plan.outputs.runs }}
      has_runs: ${{ steps.plan.outputs.has_runs }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm ci

      # Authenticates the signalk-server master SHA lookup. Unauthenticated
      # api.github.com is 60 req/hour per IP and runners share a NAT pool, so
      # the quota is often already drained by co-tenants (403). Reading a public
      # repo's commit SHA needs no scope beyond the default token's public read,
      # so this job keeps `permissions: {}` above. It runs no plugin code.
      - name: Resolve server versions
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx ts-node scripts/resolve-server.ts >> $GITHUB_OUTPUT

      # single_plugin mode injects the one requested plugin from the lag-free
      # per-package npm endpoint. discover-plugins.ts relies on the npm search
      # index, which lags publishes by up to an hour — so a freshly-published
      # plugin would be absent from the discovered set and the run would
      # silently produce zero matrix jobs. See scripts/resolve-single-plugin.ts.
      - name: Discover plugins
        env:
          MODE: ${{ github.event.inputs.mode }}
          PLUGIN: ${{ github.event.inputs.plugin }}
        run: |
          if [ "$MODE" = "single_plugin" ] && [ -n "$PLUGIN" ]; then
            npx ts-node scripts/resolve-single-plugin.ts --name "$PLUGIN" --out /tmp/plugins.json
          else
            npx ts-node scripts/discover-plugins.ts --out /tmp/plugins.json
          fi

      - name: Build TypeScript
        run: npx tsc

      - name: Plan runs
        id: plan
        env:
          MAX_MATRIX_JOBS: ${{ github.event.inputs.max_jobs || '50' }}
        run: |
          npx ts-node scripts/plan-runs.ts \
            --plugins-file /tmp/plugins.json \
            --stable-version '${{ steps.resolve.outputs.stable_version }}' \
            --master-sha '${{ steps.resolve.outputs.master_sha }}' \
            --mode '${{ github.event.inputs.mode || 'changed_only' }}' \
            --plugin-filter '${{ github.event.inputs.plugin }}' \
            --plugin-version '${{ github.event.inputs.plugin_version }}' \
            --include-master '${{ github.event.inputs.include_master || 'false' }}' \
            --is-scheduled '${{ github.event_name == 'schedule' }}' \
            >> $GITHUB_OUTPUT

      - name: Upload compiled scripts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Test — runs UNTRUSTED plugin code, NO secrets, NO token
  # ─────────────────────────────────────────────────────────────
  test:
    needs: plan
    if: needs.plan.outputs.has_runs == 'true'
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        run: ${{ fromJson(needs.plan.outputs.runs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: ${{ matrix.run.plugin }}@${{ matrix.run.pluginVersion }} x ${{ matrix.run.server }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install firejail
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq firejail

      - name: Setup server
        id: server
        uses: ./.github/actions/setup-server
        with:
          server-slot: ${{ matrix.run.server }}
          node-version: '24'

      - run: npm ci

      - name: Run plugin tests
        id: tests
        uses: ./.github/actions/run-plugin-tests
        with:
          plugin-name: ${{ matrix.run.plugin }}
          plugin-version: ${{ matrix.run.pluginVersion }}
          server-slot: ${{ matrix.run.server }}
          server-version: ${{ steps.server.outputs.server-version }}
          server-path: ${{ steps.server.outputs.server-path }}

      - name: Update results.json
        run: |
          npx ts-node scripts/update-results.ts \
            --plugin '${{ matrix.run.plugin }}' \
            --plugin-version '${{ matrix.run.pluginVersion }}' \
            --server-slot '${{ matrix.run.server }}' \
            --server-version '${{ steps.server.outputs.server-version }}' \
            --result-file /tmp/result.json \
            --reason '${{ matrix.run.reason }}'

      - name: Upload slot update artifact
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ strategy.job-index }}
          path: slot-update.json
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Merge — has write token, NEVER touches plugin code
  # ─────────────────────────────────────────────────────────────
  merge-results:
    needs: test
    if: always() && needs.test.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all result artifacts
        uses: actions/download-artifact@v8
        with:
          path: /tmp/results
          pattern: result-*

      - name: Merge and commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Re-apply envelopes onto a fresh base + push, with retries.
          # Concurrent workflow runs (manual probe overlapping with the
          # scheduled nightly, or two manual probes back-to-back) used to
          # produce a rebase conflict on results.json that killed the
          # entire run and lost every probe's result. Re-read base after
          # each push failure and re-apply the envelopes — the per-slot
          # update is idempotent.
          for attempt in 1 2 3 4 5; do
            echo "::group::merge attempt $attempt"
            git fetch origin master
            git reset --hard origin/master
            node -e "
              const fs = require('fs');
              const path = require('path');
              const base = JSON.parse(fs.readFileSync('results.json', 'utf-8'));
              const dir = '/tmp/results';
              let updated = 0;
              let rejected = 0;
              const VALID_BADGES = new Set([
                'compatible','loads','activates','has-providers','tested',
                'tests-failing','npm-audit-ok','audit-moderate','audit-high',
                'audit-critical','has-changelog','has-screenshots',
                'holds-back-core-deps','broken'
              ]);
              function validSlot(data) {
                if (!data || typeof data !== 'object') return false;
                // Number.isFinite rejects NaN / Infinity / non-numbers; the
                // bare `composite < 0 || > 100` check otherwise lets a NaN
                // composite slip through (NaN comparisons are always false).
                if (!Number.isFinite(data.composite) || data.composite < 0 || data.composite > 100) return false;
                if (!Array.isArray(data.badges) || !data.badges.every(b => VALID_BADGES.has(b))) return false;
                if (typeof data.tested !== 'string' || isNaN(Date.parse(data.tested))) return false;
                if (typeof data.installs !== 'boolean') return false;
                if (data.held_back_core_deps !== undefined && (
                  !Array.isArray(data.held_back_core_deps) ||
                  !data.held_back_core_deps.every(dep =>
                    dep && typeof dep === 'object' &&
                    typeof dep.pkg === 'string' &&
                    typeof dep.declared === 'string' &&
                    typeof dep.latest === 'string')
                )) return false;
                return true;
              }
              function applyEnvelope(f) {
                const env = JSON.parse(fs.readFileSync(f, 'utf-8'));
                const { plugin, pluginVersion, slotKey, slotResult } = env;
                if (!plugin || !pluginVersion || !slotKey || !slotResult) {
                  console.log('Skipped malformed envelope: ' + f);
                  return;
                }
                if (!slotKey.startsWith('server@')) {
                  console.log('Skipped non-server slot ' + slotKey + ' in ' + f);
                  return;
                }
                if (!validSlot(slotResult)) {
                  console.log('Rejected invalid slot: ' + plugin + '/' + pluginVersion + '/' + slotKey);
                  rejected++;
                  return;
                }
                if (!base[plugin]) base[plugin] = {};
                if (!base[plugin][pluginVersion]) base[plugin][pluginVersion] = {};
                base[plugin][pluginVersion][slotKey] = slotResult;
                updated++;
              }
              // actions/download-artifact@v8 places each artifact under
              // <path>/<artifact-name>/ when multiple artifacts match the
              // pattern, but extracts directly into <path> when only one
              // does — that single-artifact shape happens on every
              // single_plugin workflow_dispatch run. Walk both shapes.
              function walk(d) {
                for (const entry of fs.readdirSync(d, { withFileTypes: true })) {
                  const p = path.join(d, entry.name);
                  if (entry.isDirectory()) walk(p);
                  else if (entry.name === 'slot-update.json') applyEnvelope(p);
                }
              }
              if (fs.existsSync(dir)) walk(dir);
              console.log('Updated ' + updated + ' plugin slots' + (rejected ? ', rejected ' + rejected + ' invalid' : ''));
              fs.writeFileSync('results.json', JSON.stringify(base, null, 2) + '\n');
            "
            git add results.json
            if git diff --cached --quiet; then
              echo 'No changes to commit'
              echo '::endgroup::'
              break
            fi
            git commit -m "results: update from $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push origin HEAD:master; then
              echo '::endgroup::'
              break
            fi
            echo 'push rejected (concurrent commit on master); retrying'
            echo '::endgroup::'
            if [ "$attempt" -eq 5 ]; then
              echo '::error::merge-results failed after 5 attempts'
              exit 1
            fi
            # Brief jittered backoff so concurrent runs don't lockstep.
            sleep $((RANDOM % 5 + 2))
          done

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Publish — deploys to gh-pages, NEVER touches plugin code
  # ─────────────────────────────────────────────────────────────
  publish:
    needs: [plan, merge-results]
    # Run whenever plan succeeded, even if merge-results was skipped —
    # that's the "no plugin updates tonight" case. We still want to
    # refresh GitHub + npm metrics (stars, downloads, issues, contributors)
    # which change independently of plugin versions. Only skip publish if
    # merge-results actually failed (bad result data would corrupt the API).
    if: always() && needs.plan.result == 'success' && needs.merge-results.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Download compiled scripts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Build API
        env:
          # Authenticated api.github.com lifts the limit to 5000/hr so a
          # full nightly scan (~430 plugins × 2 GitHub calls) fits
          # comfortably. Only used to read public metadata (stars,
          # issues, contributor counts); the default GITHUB_TOKEN scope
          # is sufficient.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node dist/scripts/build-api.js

      - name: Deploy to gh-pages branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan gh-pages-tmp
          git rm -rf . 2>/dev/null || true
          cp -r api/* .
          git add -A
          git commit -m "api: update from $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Fail the step if every attempt failed. Without the explicit exit the
          # loop's last `sleep` returns 0, the step and the publish job report
          # success, and report-rescore then posts a score linking to a page
          # that was never deployed.
          for i in 1 2 3; do
            git push origin gh-pages-tmp:gh-pages --force && break
            if [ "$i" = 3 ]; then
              echo "Push failed after 3 attempts" >&2
              exit 1
            fi
            echo "Push attempt $i failed (concurrent update), retrying in ${i}s..."
            sleep "$i"
          done

  # ─────────────────────────────────────────────────────────────
  # JOB 5: Report — comments the score on an on-demand re-score's
  # request issue. Only runs for workflow_dispatch with rescore_issue
  # set; the scheduled nightly skips it. NEVER touches plugin code.
  # ─────────────────────────────────────────────────────────────
  report-rescore:
    needs: [merge-results, publish]
    # Always reach this job for an on-demand re-score, then decide inside what
    # to say. `always()` is load-bearing: a *skipped* dependency short-circuits
    # a job before its `if:` is evaluated, and merge-results is skipped whenever
    # the test job produced nothing (plugin wouldn't install, empty matrix,
    # sandbox death) — precisely the failures worth reporting. Without it the
    # author got the "Started a re-score…" ack and then permanent silence, with
    # the issue left open forever.
    #
    # The happy/unhappy split moves to the steps below, each gated on the same
    # pair of results this `if:` used to carry: merge-results wrote
    # results.json, publish refreshed the page the comment links to. A pipeline
    # that did not complete must never post a score — results.json would still
    # hold the previous run's number, and closing on it would report the rerun
    # as passed. It stays open for a maintainer instead.
    if: always() && github.event.inputs.rescore_issue != ''
    runs-on: ubuntu-latest
    # issues: write is the whole grant, and it only ever posts the re-score
    # outcome. Plugin code ran in the unprivileged test job and never executes
    # here, so the write token is not exposed to it.
    permissions:
      issues: write
    steps:
      # rescore.yml proves the *plugin name* is a real Signal K package before
      # dispatching, but nothing proves the *issue number* belongs to a re-score
      # request. `rescore_issue` is a free-text workflow_dispatch input, so
      # anyone holding actions: write can aim this job at an arbitrary issue or
      # PR and have the bot comment on it — and, on the scored path, close it.
      # Require the target to look like a re-score request before writing to it.
      # A rejected target fails the job loudly rather than silently writing to
      # the wrong place; the real request, if any, is still open for a human.
      - name: Verify the target is a re-score request
        uses: actions/github-script@v9
        with:
          script: |
            const issue_number = Number(process.env.ISSUE)
            if (!Number.isInteger(issue_number) || issue_number <= 0) {
              core.setFailed(`rescore_issue is not a positive integer: "${process.env.ISSUE}"`)
              return
            }
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            })
            // The issues API also returns pull requests, and issues.update
            // would happily close one. A re-score request is never a PR, so
            // reject them outright rather than relying on the markers below —
            // a PR whose title happened to start with [rescore] would other-
            // wise pass and be closed by the scored path.
            if (issue.pull_request) {
              core.setFailed(`#${issue_number} is a pull request, not a re-score request. Refusing to comment on it.`)
              return
            }
            // Either marker is enough, mirroring rescore.yml's own trigger: the
            // form applies the label, but GitHub drops it for openers without
            // triage/write, leaving the title prefix as the only survivor.
            const labelled = issue.labels.some((l) => (l.name || l) === 'rescore')
            const titled = (issue.title || '').startsWith('[rescore]')
            if (!labelled && !titled) {
              core.setFailed(
                `Issue #${issue_number} is not a re-score request ` +
                  `(no \`rescore\` label, no \`[rescore]\` title prefix). Refusing to comment on it.`
              )
            }
        env:
          ISSUE: ${{ github.event.inputs.rescore_issue }}

      - uses: actions/checkout@v7
        if: needs.merge-results.result == 'success' && needs.publish.result == 'success'
        with:
          ref: master # read the published score for the up/down comparison
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: needs.merge-results.result == 'success' && needs.publish.result == 'success'
        with:
          node-version: '24'

      - run: npm ci --ignore-scripts
        if: needs.merge-results.result == 'success' && needs.publish.result == 'success'

      # This run's actual slot outcome (composite/badges/status), independent
      # of what won the best-score merge. The reporter compares it against the
      # published score so the comment reflects the rerun, not a stale winner.
      - name: Download this run's result envelopes
        if: needs.merge-results.result == 'success' && needs.publish.result == 'success'
        uses: actions/download-artifact@v8
        with:
          path: /tmp/rescore-results
          pattern: result-*

      - name: Build result comment
        id: comment
        if: needs.merge-results.result == 'success' && needs.publish.result == 'success'
        env:
          PLUGIN: ${{ github.event.inputs.plugin }}
          ARTIFACTS_DIR: /tmp/rescore-results
        run: npx ts-node scripts/notify-rescore-result.ts >> "$GITHUB_OUTPUT"

      # Close only when a real score came back. The reporter sets scored=false
      # when this run produced no stable envelope — ambiguous between "the
      # plugin failed to load" and the documented N=0 envelope-walker path, so
      # the request stays open for a maintainer rather than being closed as if
      # it had been answered.
      - name: Comment score
        if: needs.merge-results.result == 'success' && needs.publish.result == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const body = process.env.COMMENT
            const issue_number = Number(process.env.ISSUE)
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            })
            if (process.env.SCORED === 'true') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                state: 'closed'
              })
            }
        env:
          COMMENT: ${{ steps.comment.outputs.comment }}
          SCORED: ${{ steps.comment.outputs.scored }}
          ISSUE: ${{ github.event.inputs.rescore_issue }}

      # The scan did not complete, so there is no trustworthy score to post.
      # Say so plainly and leave the issue OPEN — closing it here would strand
      # a valid request, which is the failure mode this job exists to prevent.
      - name: Report incomplete scan
        if: needs.merge-results.result != 'success' || needs.publish.result != 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const issue_number = Number(process.env.ISSUE)
            const plugin = process.env.PLUGIN
            const runUrl = `${process.env.SERVER_URL}/${process.env.REPOSITORY}/actions/runs/${process.env.RUN_ID}`
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body:
                `The re-score of \`${plugin}\` did not complete, so no score was produced. ` +
                `This is a problem with the scan itself, not necessarily with the plugin.\n\n` +
                `Run log: ${runUrl}\n\n` +
                `Leaving this open for a maintainer to look at.`
            })
        env:
          ISSUE: ${{ github.event.inputs.rescore_issue }}
          PLUGIN: ${{ github.event.inputs.plugin }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
